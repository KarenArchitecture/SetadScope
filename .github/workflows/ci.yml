name: CI

on:
  push:
    branches:
      - master
      - feature/postgres-keyword-pipeline
  pull_request:
    branches:
      - master

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest backend/tests -q
        env:
          PYTHONPATH: backend:src

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config -q

  docker-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --pull -f backend/Dockerfile -t setadscope-backend:test .
      - name: Build frontend image
        run: docker build --pull -f frontend/Dockerfile -t setadscope-frontend:test ./frontend

  auction-db-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: setad
          POSTGRES_PASSWORD: setad
          POSTGRES_DB: setadscope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U setad -d setadscope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://setad:setad@localhost:5432/setadscope
      PYTHONPATH: backend:src
      SETADSCOPE_TEST_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Migrate a fresh PostgreSQL database to previous version
        working-directory: backend
        run: alembic upgrade 0004
      - name: Seed legacy auction before category migration
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.begin() as connection:
              connection.execute(
                  text("""INSERT INTO auctions
                  (source, source_party_id, matched_keywords, raw_payload)
                  VALUES ('setad_main_estate', 'pre-migration-fixture',
                  CAST(:keywords AS json), CAST(:payload AS jsonb))"""),
                  {"keywords": '["چوب"]', "payload": '{"marker": "pre-migration"}'},
              )
          PY
      - name: Upgrade existing PostgreSQL data to latest schema
        working-directory: backend
        run: alembic upgrade head
      - name: Test all five category imports, upserts, filters and Excel endpoints
        run: python -m pytest backend/tests/test_auction_database.py -q
